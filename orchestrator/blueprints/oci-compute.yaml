ref: oci/compute-instance
target: oci
resource_kind: oci-instance
module: .
version: 1.0.0

# HOW THIS IS DELIVERED -- the cloud runs it, or we build machines and put the
# software on them.
#
# DECLARED, NEVER INFERRED. The same fact was once guessed from the technology
# CODE -- anything not prefixed `oci-`/`aws-` was assumed to be software on a
# machine -- and it was wrong in both directions: `postgres16` is OCI's managed
# database and read as software, while "Backup & Recovery" is an outcome nobody
# can install and read as software too. db/models.TechnologyDelivery exists
# because of that. This is the same fact about the BLUEPRINT, and it is stated
# here for the same reason.
#
# It is what lets the request form tell a requester what they are actually
# getting, and what will let them CHOOSE once a technology has more than one.
#
# A machine, and nothing but a machine.
delivery: vm

# How this blueprint's machines report on themselves at the end of first boot.
#
# Terraform exiting zero says the VM exists, not that anything was installed on
# it. That inference was wrong four times in one week, so every blueprint that
# boots a machine must make the machine say what it actually became. Which
# MECHANISM carries the report differs, and getting that wrong is silent: the
# Apache blueprint renders its own cloud-init, so the report added to
# configure.py never reached an Apache machine at all, and the gap was found in
# pre-flight for REQ-2026-0134 rather than by any test.
#
# Declared here so the provisioner knows whether to pass boot_report_url, and so
# test_every_machine_reports.py can hold each blueprint to it.
# user_data = the report arrives inside the user_data configure.py renders.
boot_report: user_data
builds: [compute-vm, rhel9, win2019]
os_families: [rhel, debian]

# win2019 is WINDOWS, and this blueprint claimed rhel and debian for it because
# os_families is declared per blueprint rather than per technology. Both the
# first-boot configuration and the self-report are POSIX shell; neither can run
# on Windows at all. So the certification gate was asking whether a Windows
# machine had been proven on Oracle Linux — a question with no sensible answer,
# which it reported as "unproven on debian,rhel".
#
# Declared as UNVERIFIABLE rather than as having no families. Those are different
# and the difference matters: a technology with no families boots no machine (a
# bucket) and the gate lets it through, while this one boots a real machine that
# nothing can inspect. Certifying it would be exactly the promise the gate exists
# to prevent.
#
# Lifting this needs a PowerShell reporter and a Windows machine to run it on.
cannot_verify:
  win2019: >-
    Windows: first-boot configuration and the self-report are POSIX shell and
    cannot run on it, so no machine can report what this became
# A bare VM whose first-boot configuration, if any, is rendered by
# orchestrator/configure.py — so it supports whatever configure.py supports.
# Windows images can be booted here but no software recipe covers them.
# The Terraform variable this module names its resource with.
name_var: instance_name
description: Private-only OCI Compute VM, flex-shape sized from the request.
requires_env: [OCI_COMPUTE_SUBNET_OCID, OCI_COMPUTE_IMAGE_OCID]
