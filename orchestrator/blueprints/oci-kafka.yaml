ref: oci/kafka
target: oci
resource_kind: oci-kafka
module: oci/kafka
version: 1.0.0
builds: [kafka]
description: Apache Kafka in KRaft mode on private OCI Compute instances — no ZooKeeper, one node for development or three for a fault-tolerant quorum.
# The Terraform variable this module names its brokers with.
name_var: instance_name
# OCI_KAFKA_SOURCE_URL is REQUIRED, not optional. Kafka is not in the OS
# repositories — it is an archive — and this subnet reaches Oracle's services
# but not the public internet, so the Apache CDN is unreachable. Without a
# reachable source this blueprint reported "ready", built a healthy VM, installed
# nothing, and called it a success. Declaring it required turns that into a
# refusal with the setting named.
requires_env: [OCI_COMPUTE_SUBNET_OCID, OCI_KAFKA_SOURCE_URL]
# Module inputs the standard variable set does not carry.
vars:
  # Empty means "look up the latest Oracle Linux 9 image that fits the shape".
  # The install script uses dnf and systemd, so the image must stay Red Hat
  # family; the shared OCI_COMPUTE_IMAGE_OCID default is a custom Ubuntu image
  # and would install nothing.
  image_ocid: ""
  # The module can manage its own security group, but that needs a VCN OCID the
  # standard variable set does not carry. Off by default: the subnet's own rules
  # govern access.
  create_nsg: false
  # ONE NODE by default. A three-node quorum is the smallest cluster that
  # survives losing a broker, but it is also three times the cost, so growing to
  # it is a deliberate act rather than something a request does by accident.
  broker_count: 1
  # NOTE: kafka_source_url is deliberately NOT set here. It arrives from
  # OCI_KAFKA_SOURCE_URL instead, because a pre-authenticated Object Storage URL
  # grants read access to a bucket and manifests are committed to git. Setting it
  # here would also silently override the environment, since manifest vars are
  # merged over the standard set.
