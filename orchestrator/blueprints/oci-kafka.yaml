ref: oci/kafka
target: oci
resource_kind: oci-kafka
module: oci/kafka
version: 1.0.0

# HOW THIS IS DELIVERED -- the cloud runs it, or we build machines and put the
# software on them.
#
# DECLARED, NEVER INFERRED. The same fact was once guessed from the technology
# CODE -- anything not prefixed `oci-`/`aws-` was assumed to be software on a
# machine -- and it was wrong in both directions: `postgres16` is OCI's managed
# database and read as software, while "Backup & Recovery" is an outcome nobody
# can install and read as software too. db/models.TechnologyDelivery exists
# because of that. This is the same fact about the BLUEPRINT, and it is stated
# here for the same reason.
#
# It is what lets the request form tell a requester what they are actually
# getting, and what will let them CHOOSE once a technology has more than one.
#
# Apache Kafka on OCI Compute instances we build and configure.
# NOT OCI Streaming, which is the managed alternative and has no
# blueprint here. Naming matters: a form offering "Kafka, managed"
# backed by this module would be a promise the platform cannot keep.
delivery: vm

# How this blueprint's machines report on themselves at the end of first boot.
#
# Terraform exiting zero says the VM exists, not that anything was installed on
# it. That inference was wrong four times in one week, so every blueprint that
# boots a machine must make the machine say what it actually became. Which
# MECHANISM carries the report differs, and getting that wrong is silent: the
# Apache blueprint renders its own cloud-init, so the report added to
# configure.py never reached an Apache machine at all, and the gap was found in
# pre-flight for REQ-2026-0134 rather than by any test.
#
# Declared here so the provisioner knows whether to pass boot_report_url, and so
# test_every_machine_reports.py can hold each blueprint to it.
# template  = this module renders its own cloud-init and embeds the report,
#             once per node — a cluster's nodes must not overwrite each other.
boot_report: template
builds: [kafka]
os_families: [rhel]
# Kafka's first-boot script uses dnf, firewall-cmd and systemd unit files laid
# out the Red Hat way. Never boot-tested at all, but what it WOULD run is
# unambiguously Red Hat, so the portal must not offer it on an Ubuntu image.
description: Apache Kafka in KRaft mode on private OCI Compute instances — no ZooKeeper, one node for development or three for a fault-tolerant quorum.
# The Terraform variable this module names its brokers with.
name_var: instance_name
# Longest name this module's own validation rule accepts (29 characters,
# from its instance_name regex). The portal composes names as
# <environment>-<reference>-<suffix>, which overshot this and failed at PLAN
# time — after the requester had a Jira ticket approved. Declared here so the
# portal can compose a name that fits, and refuse one that cannot.
name_max_length: 29
# OCI_KAFKA_SOURCE_URL is REQUIRED, not optional. Kafka is not in the OS
# repositories — it is an archive — and this subnet reaches Oracle's services
# but not the public internet, so the Apache CDN is unreachable. Without a
# reachable source this blueprint reported "ready", built a healthy VM, installed
# nothing, and called it a success. Declaring it required turns that into a
# refusal with the setting named.
requires_env: [OCI_COMPUTE_SUBNET_OCID, OCI_KAFKA_SOURCE_URL]
# Module inputs the standard variable set does not carry.
vars:
  # Empty means "look up the latest Oracle Linux 9 image that fits the shape".
  # The install script uses dnf and systemd, so the image must stay Red Hat
  # family; the shared OCI_COMPUTE_IMAGE_OCID default is a custom Ubuntu image
  # and would install nothing.
  image_ocid: ""
  # The module can manage its own security group, but that needs a VCN OCID the
  # standard variable set does not carry. Off by default: the subnet's own rules
  # govern access.
  create_nsg: false
  # ONE NODE by default. A three-node quorum is the smallest cluster that
  # survives losing a broker, but it is also three times the cost, so growing to
  # it is a deliberate act rather than something a request does by accident.
  broker_count: 1
  # NOTE: kafka_source_url is deliberately NOT set here. It arrives from
  # OCI_KAFKA_SOURCE_URL instead, because a pre-authenticated Object Storage URL
  # grants read access to a bucket and manifests are committed to git. Setting it
  # here would also silently override the environment, since manifest vars are
  # merged over the standard set.
