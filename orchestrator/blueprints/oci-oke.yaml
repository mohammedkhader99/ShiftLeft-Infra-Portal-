# ---------------------------------------------------------------------------
# NETWORK CONTRACT — REQUIRED, stated 16 Aug 2026 by the platform owner
# ---------------------------------------------------------------------------
# This blueprint must STOP building its own VCN and consume the subnets the
# network team already provisioned. For the DEVELOPMENT tier those are, in
# AI-ShiftLeft-DEV-VCN (10.56.32.0/19):
#
#   API SUBNET     10.56.36.0/24  OKE control plane
#     ocid1.subnet.oc1.me-dubai-1.aaaaaaaa63kqn2lgduuhbpjxkltl7zivtpq3exomwhhq766xu4v6kiclqujq
#   WORKER SUBNET  10.56.32.0/22  worker nodes          (NAT added 15 Aug 2026)
#     ocid1.subnet.oc1.me-dubai-1.aaaaaaaa57fwk3cc3lvpndiusgqrb4qammm4tcczpkjbjx62z6b727v6445a
#   POD SUBNET     10.56.37.0/24  VCN-native pods       (NAT added 15 Aug 2026)
#     ocid1.subnet.oc1.me-dubai-1.aaaaaaaac44mpicsydmcew5onyqktmdb2yr7u2nxs47lblypl22tdhum7h7q
#   LB SUBNET      10.56.38.0/24  load balancers
#     ocid1.subnet.oc1.me-dubai-1.aaaaaaaarwy6p5xjv2adqmkwf7c5tch3ljxzi4cbr3yeigpalsn23g7xsaka
#   VCN
#     ocid1.vcn.oc1.me-dubai-1.amaaaaaawr6mjjya4rcdfqwjkvvotccutud3oq6xjf7zatsd62ibxmr2gsrq
#
# PER TIER, NOT GLOBAL. The stated plan is a separate VCN per environment tier,
# so these OCIDs are the DEVELOPMENT mapping and nothing else. A tier with no
# mapping must be REFUSED, with the reason. It must never fall back to another
# tier's network: a production cluster silently built into the development VCN
# is the worst failure this blueprint could have, and it would look like success.
#
# BLOCKED ON A MODEL THAT CANNOT EXPRESS IT. The portal has no "Development"
# tier. `environment.environment_class` holds only prod | non-prod, and
# `environment_name` is free text ("test", "test113"). So "always use these
# subnets for Development" cannot be written down today — non-prod covers dev,
# test, UAT and staging alike, and one VCN per tier needs a tier to key on.
# Resolving that comes BEFORE the module rework; building the map against
# environment_class would quietly put UAT and dev in the same network.
#
# Sizing note: max_pods_per_node 31 against a /24 pod subnet (254 addresses)
# caps this at roughly 8 nodes. More than that needs a larger pod subnet, which
# is the network team's call.
# ---------------------------------------------------------------------------
ref: oci/oke
target: oci
resource_kind: oci-oke
module: oci/oke
version: 1.0.0

# How this blueprint's machines report on themselves at the end of first boot.
#
# Terraform exiting zero says the VM exists, not that anything was installed on
# it. That inference was wrong four times in one week, so every blueprint that
# boots a machine must make the machine say what it actually became. Which
# MECHANISM carries the report differs, and getting that wrong is silent: the
# Apache blueprint renders its own cloud-init, so the report added to
# configure.py never reached an Apache machine at all, and the gap was found in
# pre-flight for REQ-2026-0134 rather than by any test.
#
# Declared here so the provisioner knows whether to pass boot_report_url, and so
# test_every_machine_reports.py can hold each blueprint to it.
# none      = EXEMPT, and the reason has to be stated. OKE worker nodes boot
#             OCI's own managed node image; this module never renders their
#             cloud-init and cannot add anything to it. A cluster is checked
#             instead by whether its node pool reaches the requested size,
#             which Terraform does report truthfully.
boot_report: none
builds: [oci-oke]
os_families: [rhel]
# OKE node pools run Oracle's own managed node images (Oracle Linux). The
# requester does not choose the node OS, so this exists to stop the portal
# claiming an Ubuntu node pool it has no way to build.
description: OCI Container Engine for Kubernetes — private API endpoint, VCN-native pod networking, its own VCN and subnets, a worker node pool sized from the request, and a bastion for access.
# The Terraform variable this module names its resources with.
name_var: instance_name
# Longest name this module's own validation rule accepts (24 characters,
# from its instance_name regex). The portal composes names as
# <environment>-<reference>-<suffix>, which overshot this and failed at PLAN
# time — after the requester had a Jira ticket approved. Declared here so the
# portal can compose a name that fits, and refuse one that cannot.
name_max_length: 24
# OCI takes 10-20 minutes to build a cluster. The default 600s would kill the
# apply part way through, leaving real, billing resources that Terraform never
# recorded and a later destroy cannot find.
command_timeout_seconds: 2700
# The bastion range has no safe default: it is the public door to a private
# Kubernetes API endpoint. Declaring it here means the portal reports
# "certified but not configured" instead of building something exposed.
requires_env: [OCI_OKE_BASTION_CIDR]
#
# ARCHITECTURALLY NON-COMPLIANT, deliberately and visibly.
#
# docs/architecture (LANDING-ZONE) rules that a workload module creates ZERO
# networking and consumes a resolved network contract from a landing-zone spoke
# VCN. This module builds its own VCN, subnets, gateways and route tables — the
# pattern that document names as a known failure mode.
#
# It stays as written because there is nothing yet to be compliant WITH: the
# tenancy has no hub, no spoke VCNs and no IPAM — five ad-hoc VCNs in four flat
# compartments, and this VCN is not even attached to the one DRG that exists.
# A contract-consuming rewrite has no contract to consume.
#
# Usable for a sandbox proof. Not the production path, and not certified.
# The guard test in test_workload_modules_create_no_networking.py records this
# exception by name, so it cannot be forgotten.
vars:
  # This blueprint builds its own VCN, so it takes none of the shared compute
  # network settings. The network inputs arrive as OCI_OKE_* settings.
  #
  # KNOWN LIMITATION: nothing allocates CIDRs. The default is merely clear of
  # every range currently in the tenancy; a SECOND cluster still needs
  # OCI_OKE_VCN_CIDR set to something different, chosen by hand.
  max_pods_per_node: 31
