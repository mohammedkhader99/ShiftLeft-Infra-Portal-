ref: oci/service-vm
target: oci
resource_kind: oci-service-vm
module: oci/service-vm
version: 1.0.0

# HOW THIS IS DELIVERED -- the cloud runs it, or we build machines and put the
# software on them.
#
# DECLARED, NEVER INFERRED. The same fact was once guessed from the technology
# CODE -- anything not prefixed `oci-`/`aws-` was assumed to be software on a
# machine -- and it was wrong in both directions: `postgres16` is OCI's managed
# database and read as software, while "Backup & Recovery" is an outcome nobody
# can install and read as software too. db/models.TechnologyDelivery exists
# because of that. This is the same fact about the BLUEPRINT, and it is stated
# here for the same reason.
#
# It is what lets the request form tell a requester what they are actually
# getting, and what will let them CHOOSE once a technology has more than one.
#
# A machine we build, with the software installed at first boot.
delivery: vm

# How this blueprint's machines report on themselves at the end of first boot.
#
# Terraform exiting zero says the VM exists, not that anything was installed on
# it. That inference was wrong four times in one week, so every blueprint that
# boots a machine must make the machine say what it actually became. Which
# MECHANISM carries the report differs, and getting that wrong is silent: the
# Apache blueprint renders its own cloud-init, so the report added to
# configure.py never reached an Apache machine at all, and the gap was found in
# pre-flight for REQ-2026-0134 rather than by any test.
#
# Declared here so the provisioner knows whether to pass boot_report_url, and so
# test_every_machine_reports.py can hold each blueprint to it.
# user_data = the report arrives inside the user_data configure.py renders.
boot_report: user_data
# One blueprint, many technologies: what differs between these is a package, a
# systemd unit and a port, all declared in orchestrator/configure.py. Adding a
# technology here is a data change — but it is NOT free: each one needs its
# package name checked against the image and a real boot test before it earns a
# place in configure.VERIFIED_CODES.
# CAPABILITY, not certification. This lists what the blueprint CAN build —
# configure.py carries a per-family recipe for every one of these — and the
# portal decides separately, by certifying, which it will actually use. The
# badge on the catalogue follows certification, never this line.
#
# The three added on 15 Aug 2026 are NOT yet proven on any machine. They are
# listed because a technology absent from here is filtered out of the machine's
# first-boot configuration entirely (_components_for), so it could never be
# booted and therefore never verified: a recipe unlisted here can only stay
# unproven forever. Listing it is what makes the evidence obtainable.
builds: [nginx, redis7, java21, python312, nodejs20]
# This blueprint delegates first-boot configuration to orchestrator/configure.py,
# which carries a per-family recipe for each technology, so what it supports is
# whatever configure.py supports. Listed anyway rather than left implicit: a
# blueprint that says nothing about the operating systems it can configure is
# exactly how Apache came to be offered on Ubuntu.
os_families: [rhel, debian]
# Technologies whose INSTALL needs the public internet, over and above whatever
# the OS family needs for its packages. Oracle Linux reaches its own mirrors
# through a service gateway, so a machine can install every RPM here and still
# fail to fetch software that ships as a release archive from github.
#
# Empty for the shipped technologies — all five install from the OS repositories.
# The registry ADDS any agent-written profile that declares an archive, so the
# portal can refuse the request instead of spending a sandbox machine to learn
# what the subnet's route table already said.
needs_internet: []
description: A service installed on a private OCI Compute instance at first boot — package, systemd unit and firewall port from the technology's profile.
# The Terraform variable this module names its resource with.
name_var: instance_name
# Longest name this module's own validation rule accepts (31 characters,
# from its instance_name regex). The portal composes names as
# <environment>-<reference>-<suffix>, which overshot this and failed at PLAN
# time — after the requester had a Jira ticket approved. Declared here so the
# portal can compose a name that fits, and refuse one that cannot.
name_max_length: 31
# Without first-boot configuration this blueprint builds a bare VM with nothing
# installed on it and reports success. Refusing up front is the whole point of
# declaring the flag: an unconfigured build is a silent failure, not a partial one.
enable_flag: CONFIG_ENABLED
requires_env: [OCI_COMPUTE_SUBNET_OCID]
vars:
  # Empty means "look up the latest Oracle Linux 9 image that fits the shape".
  # The first-boot script uses dnf, systemctl and firewall-cmd, so the image must
  # stay Red Hat family; the shared OCI_COMPUTE_IMAGE_OCID default is a custom
  # Ubuntu image and would install nothing. A per-technology entry in
  # OCI_COMPUTE_IMAGE_MAP still wins over this.
  image_ocid: ""
  # The module can manage its own security group, but that needs a VCN OCID the
  # standard variable set does not carry. Off by default: the subnet's own rules
  # govern access. Supply vcn_ocid here and flip this to true to have the
  # blueprint open the service's ports itself.
  create_nsg: false
