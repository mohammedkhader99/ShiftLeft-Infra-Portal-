# One-command run for increment 0.2: starts PostgreSQL 16 and the API together.
#   docker compose up --build
# Secrets (the DB password) come from the git-ignored .env file, never from here.

services:
  db:
    image: postgres:16
    environment:
      # Postgres creates this database automatically on first start.
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      # Exposed on 5432 so you can inspect the DB from your machine if you want.
      - "5432:5432"
    volumes:
      # Named volume keeps the database data across restarts.
      - db_data:/var/lib/postgresql/data
    healthcheck:
      # Compose waits until Postgres is actually ready to accept connections.
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  opa:
    image: openpolicyagent/opa:latest
    # Run OPA as a server, loading the Rego policies from the mounted folder.
    command: ["run", "--server", "--addr=0.0.0.0:8181", "/policies"]
    volumes:
      - ./policy:/policies:ro
    ports:
      - "8181:8181"

  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    environment:
      USE_MOCK: ${USE_MOCK}
      # Connection string for later increments (1.1 onwards). Unused in 0.2.
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      # Where the API reaches the OPA policy engine (1.7).
      OPA_URL: http://opa:8181
    ports:
      - "8081:8081"
    depends_on:
      db:
        # Don't start the API until the database reports healthy.
        condition: service_healthy
      opa:
        condition: service_started

  portal:
    build:
      context: .
      dockerfile: portal/Dockerfile
    environment:
      # How the portal reaches the API over the compose network.
      API_BASE_URL: http://api:8081
    ports:
      - "5173:5173"
    depends_on:
      - api

volumes:
  db_data:
