# One-command run for increment 0.2: starts PostgreSQL 16 and the API together.
#   docker compose up --build
# Secrets (the DB password) come from the git-ignored .env file, never from here.

services:
  db:
    image: postgres:16
    environment:
      # Postgres creates this database automatically on first start.
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      # Exposed on 5432 so you can inspect the DB from your machine if you want.
      - "5432:5432"
    volumes:
      # Named volume keeps the database data across restarts.
      - db_data:/var/lib/postgresql/data
    healthcheck:
      # Compose waits until Postgres is actually ready to accept connections.
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  opa:
    image: openpolicyagent/opa:latest
    # Run OPA as a server, loading the Rego policies from the mounted folder.
    command: ["run", "--server", "--addr=0.0.0.0:8181", "/policies"]
    volumes:
      - ./policy:/policies:ro
    ports:
      - "8181:8181"

  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    environment:
      USE_MOCK: ${USE_MOCK}
      # Connection string for later increments (1.1 onwards). Unused in 0.2.
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      # Where the API reaches the OPA policy engine (1.7).
      OPA_URL: http://opa:8181
      # Signed handoff to the orchestrator (1.9). Secret comes from .env.
      ORCHESTRATOR_URL: http://orchestrator:9091
      WEBHOOK_SECRET: ${WEBHOOK_SECRET}
      # Per-adapter switches: mock uses seeded rates; live hits the cloud's
      # public price API. Each defaults to mock.
      AZURE_PRICING_MODE: ${AZURE_PRICING_MODE:-mock}  # 2.1
      OCI_PRICING_MODE: ${OCI_PRICING_MODE:-mock}      # 2.2
      # Identity validation (2.3b): live validates the Microsoft ID token the
      # portal forwards, against this tenant/client (JWKS, §8).
      AUTH_MODE: ${AUTH_MODE:-mock}
      OIDC_TENANT_ID: ${OIDC_TENANT_ID:-}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-}
      # Jira (2.4). mock = fake tickets; live = real Jira Server/DC. Secret
      # (PAT) comes from .env.
      JIRA_MODE: ${JIRA_MODE:-mock}
      JIRA_BASE_URL: ${JIRA_BASE_URL:-}
      JIRA_PAT: ${JIRA_PAT:-}
      JIRA_PROJECT_KEY: ${JIRA_PROJECT_KEY:-INFRA}
      JIRA_ISSUE_TYPE: ${JIRA_ISSUE_TYPE:-Task}
      JIRA_APPROVED_STATUSES: ${JIRA_APPROVED_STATUSES:-Approved,Done}
      JIRA_REJECTED_STATUSES: ${JIRA_REJECTED_STATUSES:-Rejected,Cancelled}
      # Jira statuses the portal transitions the ticket to during provisioning.
      JIRA_INPROGRESS_STATUS: ${JIRA_INPROGRESS_STATUS:-In Progress}
      JIRA_RESOLVED_STATUS: ${JIRA_RESOLVED_STATUS:-Resolved}
      # JSON of fields the Resolve transition requires (e.g. Solution, Closure Reason).
      JIRA_RESOLVE_FIELDS: ${JIRA_RESOLVE_FIELDS:-}
      JIRA_SET_REPORTER: ${JIRA_SET_REPORTER:-true}
      # A template ticket whose create-screen fields the portal replicates
      # automatically (incl. Insight/Assets object fields).
      JIRA_TEMPLATE_ISSUE: ${JIRA_TEMPLATE_ISSUE:-}
      # JSON overrides applied on top of the template (rarely needed).
      JIRA_EXTRA_FIELDS: ${JIRA_EXTRA_FIELDS:-}
      # Subsidiary master data: in live Jira mode a background thread syncs the
      # subsidiary dropdown from a Jira create-screen field (customfield_36200 by
      # default) into our DB every SUBSIDIARY_SYNC_INTERVAL_SECONDS, reconciling
      # add/rename/remove (removed = deactivated, never deleted). The read path
      # (lookups + validation) stays on the DB. Off in mock mode. A failed/empty
      # fetch is a no-op, so a Jira blip can't wipe the list.
      JIRA_SUBSIDIARY_FIELD: ${JIRA_SUBSIDIARY_FIELD:-customfield_36200}
      SUBSIDIARY_SYNC_ENABLED: ${SUBSIDIARY_SYNC_ENABLED:-true}
      SUBSIDIARY_SYNC_INTERVAL_SECONDS: ${SUBSIDIARY_SYNC_INTERVAL_SECONDS:-3600}
      # Hourly cloud option cache: asks the ORCHESTRATOR (which holds the OCI
      # credentials) what shapes and images exist, and caches the answer so the
      # request form reads the database rather than the cloud. Off by default —
      # turning it on starts a thread that calls a real cloud API on a timer.
      OCI_CATALOGUE_ENABLED: ${OCI_CATALOGUE_ENABLED:-false}
      OCI_CATALOGUE_REFRESH_SECONDS: ${OCI_CATALOGUE_REFRESH_SECONDS:-3600}
      # ChatOps approvals bot (F-INT-08). The in-portal Assistant console works
      # out of the box; the Slack slash-command adapter turns on only when
      # SLACK_SIGNING_SECRET is set (secret via .env, never committed).
      # CHATOPS_SLACK_MAP is JSON {slack_user_id_or_name: portal_email}. Approve/
      # reject transition Jira to these statuses (default: the first configured
      # approved/rejected status).
      SLACK_SIGNING_SECRET: ${SLACK_SIGNING_SECRET:-}
      CHATOPS_SLACK_MAP: ${CHATOPS_SLACK_MAP:-}
      CHATOPS_APPROVE_STATUS: ${CHATOPS_APPROVE_STATUS:-}
      CHATOPS_REJECT_STATUS: ${CHATOPS_REJECT_STATUS:-}
      # Sustainability estimate (F-FIN-13): indicative energy/carbon per
      # environment from its sizing. Coefficients are configurable — the power
      # draw per unit below, plus per-target PUE (SUSTAIN_PUE_ONPREM/AZURE/OCI)
      # and grid carbon intensity in gCO2e/kWh (SUSTAIN_CARBON_ONPREM/AZURE/OCI).
      # Sensible defaults ship in code; override with your real figures.
      SUSTAIN_W_PER_VCPU: ${SUSTAIN_W_PER_VCPU:-12}
      SUSTAIN_W_PER_GB_RAM: ${SUSTAIN_W_PER_GB_RAM:-0.4}
      SUSTAIN_W_PER_GB_STORAGE: ${SUSTAIN_W_PER_GB_STORAGE:-0.005}
      # Just-in-time credential delivery (F-IAM-07 / F-INT-05). VAULT_MODE=live
      # uses HashiCorp Vault: the portal creates a short-lived child token per
      # grant, reads the credential wrapped, and hands over a ONE-TIME link — it
      # stores only the token accessor and never sees the credential itself.
      # Revoking that accessor cascades to the leases it created.
      VAULT_MODE: ${VAULT_MODE:-mock}
      VAULT_ADDR: ${VAULT_ADDR:-}
      VAULT_TOKEN: ${VAULT_TOKEN:-}
      VAULT_CREDS_PATH: ${VAULT_CREDS_PATH:-database/creds/{scope}}
      VAULT_GRANT_POLICY: ${VAULT_GRANT_POLICY:-default}
      VAULT_NAMESPACE: ${VAULT_NAMESPACE:-}
      VAULT_UI_ADDR: ${VAULT_UI_ADDR:-}
      VAULT_VERIFY: ${VAULT_VERIFY:-true}
      # Backup/restore run in the orchestrator; the API only needs to know which
      # mode is active so it records a real backup id rather than metadata.
      BACKUP_MODE: ${BACKUP_MODE:-mock}
      # Scheduled auto-shutdown (F-FIN-06): the business-hours window for non-prod
      # environments (outside it = shut-down hours). The saving view is always on;
      # SHUTDOWN_ENABLED=true additionally records scheduled pause/resume in the
      # audit trail (portal-side — it never stops real cloud resources). Off by default.
      SHUTDOWN_ENABLED: ${SHUTDOWN_ENABLED:-false}
      SHUTDOWN_DAYS: ${SHUTDOWN_DAYS:-mon-fri}
      SHUTDOWN_START: ${SHUTDOWN_START:-08:00}
      SHUTDOWN_END: ${SHUTDOWN_END:-20:00}
      SHUTDOWN_TZ: ${SHUTDOWN_TZ:-UTC}
      # Read-only cloud state sync (reconciliation). The on-demand Reconcile action
      # + estate view work out of the box; CLOUD_STATE_SYNC_ENABLED=true runs the
      # background reconciliation sweep. CLOUD_STATE_MODE=live queries the real
      # OCI/Azure APIs (needs cloud creds via a vault — extension point). Read-only.
      CLOUD_STATE_MODE: ${CLOUD_STATE_MODE:-mock}
      CLOUD_STATE_SYNC_ENABLED: ${CLOUD_STATE_SYNC_ENABLED:-false}
      # Automatic Jira-status poller (2.7). When AUTO_PROVISION=true a background
      # thread pulls the live Jira status every POLL_INTERVAL_SECONDS and advances
      # approved requests on its own. The API reads PROVISION_MODE too, so it only
      # auto-*applies* (creates real resources) when apply is enabled.
      AUTO_PROVISION: ${AUTO_PROVISION:-false}
      POLL_INTERVAL_SECONDS: ${POLL_INTERVAL_SECONDS:-30}
      # How long ONE poller sweep may run while still holding the leader lease.
      # A sweep blocks on real Terraform work far longer than the 60s lease TTL,
      # so the lease is renewed from a side thread for the duration; past this
      # deadline renewal stops and a standby may take over. Defaults to twice
      # ORCHESTRATOR_TIMEOUT_SECONDS.
      POLLER_SWEEP_WATCHDOG_SECONDS: ${POLLER_SWEEP_WATCHDOG_SECONDS:-}
      # How many consecutive attributable failures withdraw a blueprint's
      # certification (C1). Three, so one bad request or a cloud having a moment
      # cannot pull a working recipe off the catalogue.
      CERTIFICATION_FAILURE_THRESHOLD: ${CERTIFICATION_FAILURE_THRESHOLD:-}
      # --- Certification proof builds (C2, ARCHITECTURE.md §4 "Attest") -------
      # OFF by default: a proof build creates real, billable infrastructure. Both
      # the api and the orchestrator must allow it — the orchestrator re-verifies
      # every limit itself rather than trusting the caller.
      CERTIFICATION_PROOF_ENABLED: ${CERTIFICATION_PROOF_ENABLED:-false}
      # The ONLY tier a proof may build in. No default on purpose: an unset or
      # unrecognised tier makes the runner refuse to start rather than pick one.
      CERTIFICATION_SANDBOX_TIER: ${CERTIFICATION_SANDBOX_TIER:-}
      # Monthly ceiling for one proof, checked against the PLAN before any apply,
      # so a proof never discovers its price by paying it.
      CERTIFICATION_COST_CAP_MONTHLY: ${CERTIFICATION_COST_CAP_MONTHLY:-}
      # How long a passing proof keeps a blueprint certified (P8, 30 days).
      CERTIFICATION_VALIDITY_DAYS: ${CERTIFICATION_VALIDITY_DAYS:-}
      # The agent writes its own Terraform and then builds it (C5c). OFF by
      # default, and bounded: every redraft is a real build in a real tenancy.
      AUTOBUILD_ENABLED: ${AUTOBUILD_ENABLED:-false}
      AUTOBUILD_MAX_ATTEMPTS: ${AUTOBUILD_MAX_ATTEMPTS:-}
      GENERATED_ROOT: ${GENERATED_ROOT:-/generated}

      PROVISION_MODE: ${PROVISION_MODE:-mock}
      # RBAC (E1.1). ROLE_SOURCE:
      #   portal - the portal's own person->role list (Admin -> Access control).
      #            Use this here: Entra gives login only and Jira has no group
      #            model the portal can read. Unlisted users get 'requester'.
      #   jira   - Jira group membership via JIRA_ROLE_MAP.
      #   mock   - ROLE_MAP (email->roles); UNMAPPED USERS GET EVERY ROLE, so it
      #            is for local development only, never a live portal.
      # PORTAL_BOOTSTRAP_ADMINS is the break-glass list: these emails are always
      # platform_admin, so the console can never be locked away.
      ROLE_SOURCE: ${ROLE_SOURCE:-mock}
      PORTAL_BOOTSTRAP_ADMINS: ${PORTAL_BOOTSTRAP_ADMINS:-}
      ROLE_MAP: ${ROLE_MAP:-}
      JIRA_ROLE_MAP: ${JIRA_ROLE_MAP:-}
      # AI request drafting (F-RPT-06): AI_MODE=live turns a plain-English
      # description into a DRAFT request via the Claude API. The AI recommends a
      # draft only — it never submits, approves, prices, or provisions
      # (ARCHITECTURE.md §7). Default "mock" is a deterministic offline drafter
      # (no key needed). Live needs ANTHROPIC_API_KEY — add it to .env yourself;
      # never commit a key.
      AI_MODE: ${AI_MODE:-mock}
      AI_MODEL: ${AI_MODEL:-claude-opus-5}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      # Segregation of duties (E1.2, F-IAM-03): when true (default) a user cannot
      # approve/apply/destroy a request they raised. The poller is exempt.
      SOD_ENFORCED: ${SOD_ENFORCED:-true}
      # Four-eyes (F-GOV-08): when true (default) the Jira approver must differ
      # from the requester, else provisioning is blocked. Live only (needs the
      # Jira changelog author); fails open if the author can't be determined.
      FOUR_EYES_ENFORCED: ${FOUR_EYES_ENFORCED:-true}
      # Audit hardening (F-SEC-01): set a secret to sign the audit chain with a
      # keyed HMAC (so raw-DB tampering can't forge hashes). Empty = plain SHA-256.
      AUDIT_HMAC_KEY: ${AUDIT_HMAC_KEY:-}
      # Approval SLA (F-GOV-01): hours a request may await approval before it is
      # flagged breached and the poller escalates (a Jira comment). 0 = always breached.
      APPROVAL_SLA_HOURS: ${APPROVAL_SLA_HOURS:-24}
      # Approval quorum (F-GOV-06): distinct Jira approvers (never the requester)
      # required before provisioning. 1 (default) = single approver. Live only.
      APPROVAL_QUORUM: ${APPROVAL_QUORUM:-1}
      # Environment TTL & renewal (F-FIN-07): non-prod environments expire after
      # TTL_DAYS_NONPROD; the poller warns owners TTL_WARN_DAYS before expiry.
      # TTL_ENFORCE=true auto-decommissions expired non-prod envs (default off =
      # warn/flag only). Prod/dr never expire.
      TTL_DAYS_NONPROD: ${TTL_DAYS_NONPROD:-30}
      TTL_WARN_DAYS: ${TTL_WARN_DAYS:-7}
      TTL_ENFORCE: ${TTL_ENFORCE:-false}
      # Budget guardrails (F-FIN-02): a submit whose cost centre would exceed its
      # budget warns, and hard-blocks only when BUDGET_ENFORCE=true (default off).
      # BUDGET_WARN_PCT is the "approaching budget" threshold. Cost centres with
      # no budget defined are ungated.
      BUDGET_ENFORCE: ${BUDGET_ENFORCE:-false}
      BUDGET_WARN_PCT: ${BUDGET_WARN_PCT:-90}
      # Quota guardrails (F-FIN-08): a create whose project would exceed its
      # environment quota warns, and hard-blocks only when QUOTA_ENFORCE=true
      # (default off). Projects with no quota defined are ungated.
      QUOTA_ENFORCE: ${QUOTA_ENFORCE:-false}
      # Actual-vs-estimate variance (F-FIN-01): recording a billed actual that
      # drifts from the estimate by more than this percentage raises a one-time
      # variance alert (Jira comment + audit).
      VARIANCE_ALERT_PCT: ${VARIANCE_ALERT_PCT:-15}
      # Ownership orphan detection (F-LCM-10): comma-separated people who have
      # left; a provisioned environment whose effective owner is on this list is
      # flagged for reassignment. Empty by default (a directory sync fills it later).
      DEPARTED_OWNERS: ${DEPARTED_OWNERS:-}
      # Change window (F-GOV-05): when enabled, provisioning of approved requests
      # only happens inside the window; outside it they are held until it opens.
      CHANGE_WINDOW_ENABLED: ${CHANGE_WINDOW_ENABLED:-false}
      CHANGE_WINDOW_DAYS: ${CHANGE_WINDOW_DAYS:-mon-fri}
      CHANGE_WINDOW_START: ${CHANGE_WINDOW_START:-08:00}
      CHANGE_WINDOW_END: ${CHANGE_WINDOW_END:-18:00}
      CHANGE_WINDOW_TZ: ${CHANGE_WINDOW_TZ:-UTC}
    ports:
      - "8081:8081"
    volumes:
      # The agent writes drafts here; the orchestrator discovers them
      # from the same directory (C5).
      - ./generated:/generated
    depends_on:
      db:
        # Don't start the API until the database reports healthy.
        condition: service_healthy
      opa:
        condition: service_started

  orchestrator:
    build:
      context: .
      dockerfile: orchestrator/Dockerfile
    environment:
      # Re-verifies approval via the API and re-checks policy via OPA (§4).
      API_URL: http://api:8081
      OPA_URL: http://opa:8181
      WEBHOOK_SECRET: ${WEBHOOK_SECRET}
      # Real provisioning (2.6a). mock (default) creates nothing; plan runs
      # `terraform plan` against the OCI sandbox (still creates nothing); apply
      # is not enabled until 2.6b. OCI creds are supplied by the reviewer and
      # the private key is mounted read-only from ./secrets (git-ignored).
      PROVISION_MODE: ${PROVISION_MODE:-mock}
      OCI_TENANCY_OCID: ${OCI_TENANCY_OCID:-}
      OCI_USER_OCID: ${OCI_USER_OCID:-}
      OCI_FINGERPRINT: ${OCI_FINGERPRINT:-}
      OCI_PRIVATE_KEY_PATH: ${OCI_PRIVATE_KEY_PATH:-/secrets/oci_api_key.pem}
      OCI_REGION: ${OCI_REGION:-}
      OCI_COMPARTMENT_OCID: ${OCI_COMPARTMENT_OCID:-}
      # Optional OCI Vault key OCID for customer-managed bucket encryption
      # (F-SEC-04). Empty uses Oracle-managed encryption; set it to clear the
      # IaC scanner's no-CMK finding for restricted/confidential data.
      OCI_KMS_KEY_OCID: ${OCI_KMS_KEY_OCID:-}
      # Compute (VM) provisioning inputs, to really provision an oci-instance in
      # apply mode. REQUIRED: an existing subnet (private-only) + an OS image (a
      # custom image OCID is fine). OPTIONAL access: an SSH public key and/or
      # cloud-init user-data (e.g. to set a password on a custom image) — supply
      # neither for an image with a baked-in password. Missing a REQUIRED one =
      # a compute apply refuses with a clear message. All customer-supplied; never
      # commit these.
      OCI_COMPUTE_SUBNET_OCID: ${OCI_COMPUTE_SUBNET_OCID:-}
      # Default OS image, used for any technology not in the per-technology map.
      OCI_COMPUTE_IMAGE_OCID: ${OCI_COMPUTE_IMAGE_OCID:-}
      # Optional per-technology image map (JSON: technology_code -> image OCID),
      # e.g. {"rhel9":"ocid1.image...","win2019":"ocid1.image..."}. A component's
      # technology picks its image; unmapped ones use OCI_COMPUTE_IMAGE_OCID.
      OCI_COMPUTE_IMAGE_MAP: ${OCI_COMPUTE_IMAGE_MAP:-}
      OCI_COMPUTE_SSH_AUTHORIZED_KEY: ${OCI_COMPUTE_SSH_AUTHORIZED_KEY:-}
      OCI_COMPUTE_USER_DATA: ${OCI_COMPUTE_USER_DATA:-}
      # Compute shape (default VM.Standard.E4.Flex). Must be compatible with the
      # image — check with list-image-shape-compatibility. A *.Flex shape is sized
      # from the request; a fixed shape uses its own sizing.
      OCI_COMPUTE_SHAPE: ${OCI_COMPUTE_SHAPE:-VM.Standard.E4.Flex}
      # Optional: the compartment the VM + its subnet/image live in (empty = same
      # as buckets, OCI_COMPARTMENT_OCID). The orchestrator's OCI user needs IAM
      # rights to use subnets/vnics, read instance-images, and manage instances
      # there. Describe/stop/start also look the instance up in this compartment.
      OCI_COMPUTE_COMPARTMENT_OCID: ${OCI_COMPUTE_COMPARTMENT_OCID:-}
      # IaC security scanning (F-SEC-03/04): the terraform plan is scanned before
      # apply. When true, a HIGH-severity finding blocks the handoff; default off
      # = scan + report only (the API audits the findings either way).
      IAC_SCAN_ENFORCE: ${IAC_SCAN_ENFORCE:-false}
      # Cloud state sync: the orchestrator's cloud_state adapter reports (describe)
      # and, for compute, changes (actuate) the actual state of a request's
      # resources. mock (default) reflects the registry and changes no real cloud;
      # live uses the real OCI SDK, reusing the OCI_* creds above.
      # CLOUD_STATE_SIMULATE_MISSING is a mock demo hook: comma-separated
      # references whose resources are reported missing, to show a divergence
      # offline. OCI_ACTUATE_ENABLED is a SECOND explicit opt-in for real
      # stop/start (default off) — so live reconciliation (read) never by itself
      # enables live actuation (write).
      CLOUD_STATE_MODE: ${CLOUD_STATE_MODE:-mock}
      CLOUD_STATE_SIMULATE_MISSING: ${CLOUD_STATE_SIMULATE_MISSING:-}
      OCI_ACTUATE_ENABLED: ${OCI_ACTUATE_ENABLED:-false}
      # Managed PostgreSQL (GAP-ANALYSIS step 2). OCI_PSQL_ENABLED is a SECOND
      # explicit opt-in on top of the subnet + vault-secret inputs, because a
      # managed DB system is billable and this stack can provision autonomously.
      # Absent any of them, a real apply refuses instead of creating a database.
      OCI_PSQL_ENABLED: ${OCI_PSQL_ENABLED:-false}
      OCI_PSQL_SUBNET_OCID: ${OCI_PSQL_SUBNET_OCID:-}
      # The OCI Vault SECRET OCID for the admin password — a reference, never the
      # password itself, so it stays out of the plan file and Terraform state.
      OCI_PSQL_ADMIN_SECRET_OCID: ${OCI_PSQL_ADMIN_SECRET_OCID:-}
      OCI_PSQL_ADMIN_SECRET_VERSION: ${OCI_PSQL_ADMIN_SECRET_VERSION:-1}
      OCI_PSQL_ADMIN_USERNAME: ${OCI_PSQL_ADMIN_USERNAME:-pgadmin}
      OCI_PSQL_COMPARTMENT_OCID: ${OCI_PSQL_COMPARTMENT_OCID:-}
      OCI_PSQL_VERSION: ${OCI_PSQL_VERSION:-14}
      # No default shape. E4 is not published in me-dubai-1, so the old default
      # named a machine OCI cannot build. Resolved from OCI at provision time
      # (orchestrator/postgres_shapes.py); set this only to pin a shape.
      OCI_PSQL_SHAPE: ${OCI_PSQL_SHAPE:-}
      OCI_PSQL_STORAGE_IOPS: ${OCI_PSQL_STORAGE_IOPS:-75000}
      # Real backup/restore of that database (F-LCM-06). Live additionally needs
      # OCI_PSQL_ENABLED. NOTE: a restore creates a SECOND, billable DB system —
      # OCI managed PostgreSQL has no in-place rollback.
      BACKUP_MODE: ${BACKUP_MODE:-mock}
      RESTORE_MODE: ${RESTORE_MODE:-mock}
      # First-boot configuration (GAP-ANALYSIS step 4): cloud-init installs and
      # enables the requested technologies on a new VM, because private-only VMs
      # can't be reached over SSH. Off by default — it changes what a VM does at
      # boot and REQUIRES the subnet to have egress (NAT/service gateway) or an
      # internal mirror, otherwise the install fails and you get a bare VM.
      # CONFIG_PACKAGE_MAP (JSON) corrects package names for your image;
      # CONFIG_OS_FAMILY switches package manager (rhel|debian|suse).
      CONFIG_ENABLED: ${CONFIG_ENABLED:-false}
      # Reading the OCI Marketplace so a PERSON can choose a listing (C9).
      # Off by default: it adds a network call, and nothing in the portal
      # chooses a listing on its own.
      MARKETPLACE_ENABLED: ${MARKETPLACE_ENABLED:-false}
      CONFIG_OS_FAMILY: ${CONFIG_OS_FAMILY:-rhel}
      CONFIG_PACKAGE_MAP: ${CONFIG_PACKAGE_MAP:-}
      # Live capacity reduction (GAP-ANALYSIS step 3): scales a provisioned VM or
      # managed database DOWN by re-planning its Terraform workspace with the
      # smaller sizing. Needs PROVISION_MODE=apply as well. A real resize RESTARTS
      # the resource, so it is off by default.
      REDUCE_MODE: ${REDUCE_MODE:-mock}
      # The managed-PostgreSQL shape family used when a database is resized;
      # available shapes differ by region and change over time.
      # DNS records for environments (GAP-ANALYSIS step 5). A 'dns' request names
      # a provisioned environment; the record is planned into that environment's
      # own Terraform workspace so it shares its lifecycle. Needs the opt-in AND a
      # zone; without both a real apply refuses. Also needs PROVISION_MODE=apply.
      DNS_MODE: ${DNS_MODE:-mock}
      OCI_DNS_ENABLED: ${OCI_DNS_ENABLED:-false}
      OCI_DNS_ZONE: ${OCI_DNS_ZONE:-}
      OCI_DNS_TTL: ${OCI_DNS_TTL:-300}
      OCI_DNS_COMPARTMENT_OCID: ${OCI_DNS_COMPARTMENT_OCID:-}
      # OKE. Without these lines the orchestrator cannot see them at all, however
      # carefully they are set in .env — a blueprint would report "not configured"
      # forever with no way to fix it.
      OCI_OKE_BASTION_CIDR: ${OCI_OKE_BASTION_CIDR:-}
      # Per-tier network map: {tier: {vcn, api, node, pod, lb, bastion}}.
      # Replaced OCI_OKE_VCN_CIDR, which asked the module to CHOOSE an
      # address range; it is now given subnets the network team allocated.
      OCI_OKE_NETWORKS: ${OCI_OKE_NETWORKS:-}
      # How long the supported-Kubernetes-version answer is cached.
      # Versions are retired on Oracle's schedule, so an hour keeps a
      # long-running orchestrator from holding one past retirement.
      OKE_VERSION_TTL_SECONDS: ${OKE_VERSION_TTL_SECONDS:-}
      # --- Certification proof builds (C2, ARCHITECTURE.md §4 "Attest") -------
      # OFF by default: a proof build creates real, billable infrastructure. Both
      # the api and the orchestrator must allow it — the orchestrator re-verifies
      # every limit itself rather than trusting the caller.
      CERTIFICATION_PROOF_ENABLED: ${CERTIFICATION_PROOF_ENABLED:-false}
      # The ONLY tier a proof may build in. No default on purpose: an unset or
      # unrecognised tier makes the runner refuse to start rather than pick one.
      CERTIFICATION_SANDBOX_TIER: ${CERTIFICATION_SANDBOX_TIER:-}
      # Monthly ceiling for one proof, checked against the PLAN before any apply,
      # so a proof never discovers its price by paying it.
      CERTIFICATION_COST_CAP_MONTHLY: ${CERTIFICATION_COST_CAP_MONTHLY:-}
      # Where agent-written blueprints and modules live (C5a). Mounted, never
      # baked in: a module written into the image at run time is invisible to
      # discovery and gone on the next restart.
      GENERATED_BLUEPRINT_DIR: ${GENERATED_BLUEPRINT_DIR:-/generated/blueprints}
      GENERATED_MODULE_DIR: ${GENERATED_MODULE_DIR:-/generated/terraform}
      # Agent-written technology profiles (C6). Same mounted store, kept in
      # its own directory so configure.py reads recipes and the registry
      # reads manifests without either tripping over the other.
      GENERATED_PROFILE_DIR: ${GENERATED_PROFILE_DIR:-/generated/profiles}

      PSQL_CATALOGUE_TTL_SECONDS: ${PSQL_CATALOGUE_TTL_SECONDS:-}
      OCI_OKE_KUBERNETES_VERSION: ${OCI_OKE_KUBERNETES_VERSION:-}
      OCI_OKE_CLUSTER_TYPE: ${OCI_OKE_CLUSTER_TYPE:-}
      # Kafka: a pre-authenticated Object Storage URL for the release archive.
      OCI_KAFKA_SOURCE_URL: ${OCI_KAFKA_SOURCE_URL:-}
      # Cloud option catalogue (read-only shape/image listing for the request
      # form). Both allow-lists default to EMPTY on purpose: unset means offer
      # nothing, so an unconfigured portal cannot put a bare-metal GPU shape on a
      # dropdown. Setting them is a deliberate act.
      OCI_CATALOGUE_MODE: ${OCI_CATALOGUE_MODE:-mock}
      OCI_SHAPE_ALLOWLIST: ${OCI_SHAPE_ALLOWLIST:-}
      OCI_IMAGE_FILTER: ${OCI_IMAGE_FILTER:-}
      # Where a machine PUTs evidence about itself at the end of first boot. A
      # write-only pre-authenticated request; unset means machines are not asked
      # to report and nothing about a boot changes.
      OCI_BOOT_REPORT_PAR_URL: ${OCI_BOOT_REPORT_PAR_URL:-}
      # AWS. Terraform's AWS provider reads these from the environment, so
      # without them the aws/s3 blueprint can never work however they are set.
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_REGION: ${AWS_REGION:-}
      AWS_KMS_KEY_ARN: ${AWS_KMS_KEY_ARN:-}
      # Reported by /posture, so it must be settable — otherwise the console
      # shows a value the container could never have received.
      REFRESH_MODE: ${REFRESH_MODE:-mock}
      COST_DRIFT_THRESHOLD: ${COST_DRIFT_THRESHOLD:-0.10}
      TF_STATE_DIR: ${TF_STATE_DIR:-/tfstate}
    ports:
      - "9091:9091"
    volumes:
      - ./secrets:/secrets:ro
      # Agent-written blueprints and modules (C5a). MOUNTED, not baked into the
      # image: a module written at run time into the image would be invisible to
      # discovery and would vanish on the next restart, so the loop could never
      # close. Kept apart from the shipped recipes on purpose — a generated
      # blueprint is not a reviewed one, and may not shadow one.
      - ./generated:/generated
      # Durable per-request Terraform state (2.6c) — survives restarts.
      - tfstate:/tfstate
    depends_on:
      - opa

  # Classic HTMX+Jinja portal. Superseded by the React `webapp` at UX.5 and
  # parked here as a demo fallback: it is in the "fallback" profile, so a plain
  # `docker compose up` does NOT start it. It still claims host port 5173, so
  # bring it back only after stopping `webapp`:
  #   docker compose stop webapp && docker compose --profile fallback up -d portal
  # A DEV-ONLY HashiCorp Vault for verifying just-in-time credential delivery
  # (F-INT-05). NOT started by a normal `docker compose up` — it sits behind a
  # profile. Dev mode keeps everything in memory with a known root token, so it is
  # for local proof only and must never be used as a real vault.
  #
  #   docker compose --profile dev-vault up -d vault
  #   # then configure the database secrets engine and point the API at it:
  #   #   VAULT_MODE=live VAULT_ADDR=http://localhost:8200 VAULT_TOKEN=dev-root-token
  #
  # See GAP-ANALYSIS.md §10 for the verification this reproduces.
  vault:
    profiles: ["dev-vault"]
    image: hashicorp/vault:1.15
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: dev-root-token
      VAULT_DEV_LISTEN_ADDRESS: 0.0.0.0:8200
    cap_add:
      - IPC_LOCK
    ports:
      - "8200:8200"

  portal:
    profiles: ["fallback"]
    build:
      context: .
      dockerfile: portal/Dockerfile
    environment:
      # How the portal reaches the API over the compose network.
      API_BASE_URL: http://api:8081
      # Sign-in (2.3a). mock = local dev login; live = Microsoft Entra ID.
      AUTH_MODE: ${AUTH_MODE:-mock}
      SESSION_SECRET: ${SESSION_SECRET:-dev-insecure-session-secret}
      OIDC_TENANT_ID: ${OIDC_TENANT_ID:-}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:-}
      OIDC_REDIRECT_URI: ${OIDC_REDIRECT_URI:-}
    ports:
      - "5173:5173"
    depends_on:
      - api

  # React + IBM Carbon portal served via a FastAPI Backend-for-Frontend.
  # UX.5 cutover (2026-07-29): this is now THE portal — it answers on host port
  # 5173 (the classic portal's old port), reusing the Entra redirect URI that is
  # already registered for 5173. The container still listens on 5174 internally.
  webapp:
    build:
      context: ./webapp
      dockerfile: Dockerfile
    environment:
      API_BASE_URL: http://api:8081
      # Sign-in (UX.1b). mock = local dev identity; live = Microsoft Entra ID.
      # Reuses the same Entra app as the portal but needs its OWN redirect URI
      # (this service runs on :5174) — set WEBAPP_OIDC_REDIRECT_URI and register
      # it in Entra. The id token is forwarded to the API (validated there).
      AUTH_MODE: ${AUTH_MODE:-mock}
      SESSION_SECRET: ${SESSION_SECRET:-dev-insecure-session-secret}
      OIDC_TENANT_ID: ${OIDC_TENANT_ID:-}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:-}
      OIDC_REDIRECT_URI: ${WEBAPP_OIDC_REDIRECT_URI:-}
    ports:
      # Host 5173 (familiar URL, registered redirect URI) -> container 5174.
      - "5173:5174"
    depends_on:
      - api

volumes:
  db_data:
  tfstate:
